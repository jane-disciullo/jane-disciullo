<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Skills: correlation analysis, linear and logistic regression, algorithmic trading, AI, social media marketing, customer service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1c"/>
      <stop offset="1" stop-color="#0d1030"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>

  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#a78bfa" letter-spacing="5">
    <text x="72" y="58">CAPABILITIES</text>
  </g>
  <g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="38" fill="#ffffff">
    <text x="70" y="104">What I work with</text>
  </g>

  <!-- card 1 -->
  <g>
    <rect x="60" y="136" width="344" height="204" rx="18" fill="#101030" stroke="url(#g1)" stroke-width="1.5"/>
    <rect x="60" y="136" width="344" height="6" rx="3" fill="url(#g1)"/>
    <text x="86" y="182" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#a5b4fc" letter-spacing="3">01</text>
    <text x="86" y="220" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#ffffff">Analyze</text>
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e5e7eb">
      <circle cx="92" cy="252" r="3.5" fill="#a5b4fc"/><text x="108" y="258">Correlation Analysis</text>
      <circle cx="92" cy="280" r="3.5" fill="#a5b4fc"/><text x="108" y="286">Linear Regression</text>
      <circle cx="92" cy="308" r="3.5" fill="#a5b4fc"/><text x="108" y="314">Logistic Regression</text>
    </g>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="428" y="136" width="344" height="204" rx="18" fill="#101030" stroke="url(#g2)" stroke-width="1.5"/>
    <rect x="428" y="136" width="344" height="6" rx="3" fill="url(#g2)"/>
    <text x="454" y="182" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#f9a8d4" letter-spacing="3">02</text>
    <text x="454" y="220" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#ffffff">Automate</text>
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e5e7eb">
      <circle cx="460" cy="252" r="3.5" fill="#f9a8d4"/><text x="476" y="258">Algorithmic Trading</text>
      <circle cx="460" cy="280" r="3.5" fill="#f9a8d4"/><text x="476" y="286">AI</text>
    </g>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="796" y="136" width="344" height="204" rx="18" fill="#101030" stroke="url(#g3)" stroke-width="1.5"/>
    <rect x="796" y="136" width="344" height="6" rx="3" fill="url(#g3)"/>
    <text x="822" y="182" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#fcd34d" letter-spacing="3">03</text>
    <text x="822" y="220" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#ffffff">Communicate</text>
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e5e7eb">
      <circle cx="828" cy="252" r="3.5" fill="#fcd34d"/><text x="844" y="258">Social Media Marketing</text>
      <circle cx="828" cy="280" r="3.5" fill="#fcd34d"/><text x="844" y="286">Customer Service</text>
    </g>
