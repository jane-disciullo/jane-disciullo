<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Jane Disciullo - Data Science, Algorithmic Trading, AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.55" stop-color="#130b2e"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f5d0fe"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- drifting color orbs -->
  <g filter="url(#blur)">
    <circle cx="260" cy="120" r="150" fill="#7c3aed" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 40; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="330" r="170" fill="#db2777" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 -50; 0 0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="80" r="120" fill="#f59e0b" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 60; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- chart frame -->
  <g opacity="0.9">
    <path d="M640 60V350H1160" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
    <g stroke="#ffffff" stroke-opacity="0.18">
      <path d="M640 130H1160 M640 200H1160 M640 270H1160" stroke-dasharray="2 8"/>
      <path d="M770 60V350 M900 60V350 M1030 60V350" stroke-dasharray="2 8"/>
    </g>
  </g>

  <!-- logistic curve -->
  <path d="M640 345 C 820 345, 900 75, 1140 75" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 7" opacity="0.8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- scatter points -->
  <g fill="#e9d5ff" filter="url(#glow)">
    <circle cx="650" cy="302" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="311" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="268" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="280" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="245" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="256" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="218" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="225" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="182" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="189" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="155" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="164" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="131" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="141" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="102" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- regression line draws itself -->
  <line x1="640" y1="320" x2="1150" y2="106" stroke="url(#fit)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" values="600;0" dur="2.4s" begin="0.4s" fill="freeze"/>
  </line>

  <!-- chart labels -->
  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#ffffff">
    <text x="650" y="84" fill-opacity="0.75">y = mx + b</text>
    <text x="650" y="104" fill="#fbbf24" fill-opacity="0.9">p = 1 / (1 + e^-z)</text>
    <text x="1160" y="372" text-anchor="end" fill-opacity="0.35">fit(x, y)</text>
  </g>

  <!-- left: type -->
  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#c4b5fd" letter-spacing="5">
    <text x="72" y="92">DATA  /  QUANT  /  AI</text>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </g>

  <g font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="url(#name)">
    <text x="66" y="200" font-size="104">Jane</text>
    <text x="66" y="302" font-size="104">Disciullo</text>
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </g>

  <rect x="72" y="330" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="0;300" dur="1.8s" begin="0.6s" fill="freeze"/>
  </rect>

  <text x="72" y="368" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">
    Turning noisy data into decisions.
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1s" fill="freeze"/>
  </text>
</svg>
