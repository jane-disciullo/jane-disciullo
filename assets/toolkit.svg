<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Toolkit: Python, Pandas, NumPy, Jupyter, Excel, Helius">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#0a0a1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>

  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#a78bfa" letter-spacing="5">
    <text x="72" y="58">TOOLKIT</text>
  </g>

  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="20" fill="#ffffff">
    <g>
      <rect x="60" y="100" width="170" height="64" rx="32" fill="#101030" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="90" cy="132" r="7" fill="#8b5cf6"/>
      <text x="108" y="139">Python</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="250" y="100" width="170" height="64" rx="32" fill="#101030" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="280" cy="132" r="7" fill="#ec4899"/>
      <text x="298" y="139">Pandas</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="440" y="100" width="170" height="64" rx="32" fill="#101030" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="470" cy="132" r="7" fill="#f59e0b"/>
      <text x="488" y="139">NumPy</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="630" y="100" width="170" height="64" rx="32" fill="#101030" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="660" cy="132" r="7" fill="#38bdf8"/>
      <text x="678" y="139">Jupyter</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="820" y="100" width="170" height="64" rx="32" fill="#101030" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="850" cy="132" r="7" fill="#34d399"/>
      <text x="868" y="139">Excel</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1010" y="100" width="150" height="64" rx="32" fill="#101030" stroke="#fb7185" stroke-width="1.5"/>
      <circle cx="1040" cy="132" r="7" fill="#fb7185"/>
      <text x="1058" y="139">Helius</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
