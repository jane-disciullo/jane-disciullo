<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Certifications from WorldQuant University: Data Science Application and Data Science Modeling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1c"/>
      <stop offset="1" stop-color="#140b2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" fill="url(#bg)"/>

  <g font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#a78bfa" letter-spacing="5">
    <text x="72" y="58">CERTIFICATIONS</text>
  </g>

  <!-- card 1 -->
  <g>
    <rect x="60" y="86" width="520" height="190" rx="20" fill="#101030" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="76" y="102" width="488" height="158" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 6"/>
    <g transform="translate(150 181)">
      <circle r="38" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <circle r="28" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="2 5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" y="8" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="26" fill="#fde68a">WQU</text>
    </g>
    <text x="220" y="148" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#fbbf24" letter-spacing="4">CERTIFICATE</text>
    <text x="220" y="190" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="31" fill="#ffffff">Data Science</text>
    <text x="220" y="228" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="31" fill="#ffffff">Application</text>
    <text x="220" y="256" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e5e7eb" fill-opacity="0.7">Issued by WorldQuant University</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="620" y="86" width="520" height="190" rx="20" fill="#101030" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="636" y="102" width="488" height="158" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 6"/>
    <g transform="translate(710 181)">
      <circle r="38" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <circle r="28" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="2 5">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" y="8" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="26" fill="#fde68a">WQU</text>
    </g>
    <text x="780" y="148" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#fbbf24" letter-spacing="4">CERTIFICATE</text>
    <text x="780" y="190" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="31" fill="#ffffff">Data Science</text>
    <text x="780" y="228" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="31" fill="#ffffff">Modeling</text>
    <text x="780" y="256" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e5e7eb" fill-opacity="0.7">Issued by WorldQuant University</text>
  </g>
</svg>
